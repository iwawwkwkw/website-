    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Comic Neue', cursive, sans-serif;
            background-color: #fef08a;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Comic Pop-Art Halftone Background */
        .popart-bg {
            background-color: #fef08a;
            background-image: radial-gradient(#facc15 3px, transparent 3px);
            background-size: 24px 24px;
        }

        /* Comic Bold Borders & Shadows */
        .comic-panel {
            border: 4px solid #000;
            box-shadow: 6px 6px 0px #000;
            background: #ffffff;
        }

        .comic-header {
            border: 4px solid #000;
            box-shadow: 4px 4px 0px #000;
            background: #ff5722;
        }

        .comic-button {
            border: 3px solid #000;
            box-shadow: 3px 3px 0px #000;
            transition: all 0.1s ease;
            cursor: pointer;
        }
        .comic-button:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px #000;
        }
        .comic-button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }

        /* Bubbles */
        .bubble-user {
            border: 3px solid #000;
            box-shadow: 3px 3px 0px #000;
            background-color: #38bdf8;
            color: #000;
        }

        .bubble-bot {
            border: 3px solid #000;
            box-shadow: 3px 3px 0px #000;
            background-color: #f43f5e;
            color: #fff;
        }

        /* Subtle Floating Animation for Header Tag */
        @keyframes floatBadge {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-3px) rotate(2deg); }
        }
        .badge-animate {
            animation: floatBadge 3s ease-in-out infinite;
        }

        /* Typing Dots */
        @keyframes dotPulse {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .dot-1 { animation: dotPulse 0.6s infinite ease-in-out; }
        .dot-2 { animation: dotPulse 0.6s infinite ease-in-out 0.15s; }
        .dot-3 { animation: dotPulse 0.6s infinite ease-in-out 0.3s; }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #fef08a;
            border-left: 3px solid #000;
        }
        ::-webkit-scrollbar-thumb {
            background: #000;
            border-radius: 4px;
        }
    </style>
</head>
<body class="popart-bg flex flex-col h-screen p-2 sm:p-4">

    <!-- Header / Navbar -->
    <header class="w-full max-w-2xl mx-auto comic-header rounded-xl p-3 sm:p-4 flex items-center justify-between mb-2 sm:mb-3 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 sm:w-12 sm:h-12 bg-yellow-300 border-3 border-black rounded-lg flex items-center justify-center font-['Bangers'] text-2xl text-black shadow-[2px_2px_0px_#000]">
                AI
            </div>
            <div>
                <h1 class="font-['Bangers'] text-2xl sm:text-3xl tracking-wider text-white drop-shadow-[2px_2px_0px_#000]">
                    COMIC CHAT AI
                </h1>
                <div class="inline-block bg-yellow-300 border-2 border-black px-2 py-0.5 rounded text-xs font-bold text-black badge-animate shadow-[2px_2px_0px_#000] mt-0.5">
                    ⚡ Developer: <span class="text-red-600 font-extrabold">Iwaw</span>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="toggleCorsMode()" id="cors-mode-btn" title="Toggle Mode Koneksi" class="comic-button bg-yellow-300 text-black px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-lg text-xs sm:text-sm font-bold flex items-center gap-1">
                <i class="fa-solid fa-shield-halved"></i> <span id="mode-label">API Mode</span>
            </button>
            <button onclick="clearChat()" class="comic-button bg-white text-black px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-lg text-xs sm:text-sm font-bold flex items-center gap-1">
                <i class="fa-solid fa-rotate-right"></i> Reset
            </button>
        </div>
    </header>

    <!-- Main Chat Container -->
    <main class="w-full max-w-2xl mx-auto comic-panel rounded-xl flex-1 flex flex-col overflow-hidden mb-2">
        
        <!-- Chat Messages Area -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-3 sm:p-5 space-y-4 bg-white">
            <!-- Greeting Message -->
            <div class="flex items-start space-x-3">
                <div class="w-9 h-9 sm:w-10 sm:h-10 bg-red-500 border-3 border-black rounded-xl flex items-center justify-center text-white font-['Bangers'] text-lg shadow-[2px_2px_0px_#000] shrink-0 mt-1">
                    AI
                </div>
                <div class="max-w-[80%] sm:max-w-[75%] bubble-bot rounded-2xl rounded-tl-none px-4 py-3 text-sm sm:text-base font-bold leading-relaxed">
                    POW! Halo! Aku adalah DeepSeek V4 Flash buatan Iwaw yang siap membantumu dengan gaya komik interaktif! Ada pertanyaan atau misi apa hari ini? 🚀
                </div>
            </div>
        </div>

        <!-- Typing Indicator (Hidden by default) -->
        <div id="typing-indicator" class="hidden px-4 py-2 bg-slate-100 border-t-3 border-black flex items-center space-x-3">
            <div class="w-7 h-7 bg-red-500 border-2 border-black rounded-lg flex items-center justify-center text-white font-['Bangers'] text-xs">
                AI
            </div>
            <div class="bubble-bot px-3 py-2 rounded-xl flex items-center space-x-1.5 text-xs font-bold">
                <span>AI sedang meracik jawaban</span>
                <span class="w-2 h-2 bg-white rounded-full border border-black dot-1"></span>
                <span class="w-2 h-2 bg-white rounded-full border border-black dot-2"></span>
                <span class="w-2 h-2 bg-white rounded-full border border-black dot-3"></span>
            </div>
        </div>

        <!-- Input Bar -->
        <div class="p-3 sm:p-4 bg-yellow-300 border-t-4 border-black">
            <form id="chat-form" onsubmit="handleSendMessage(event)" class="flex items-center gap-2">
                <input type="text" id="user-input" placeholder="Tulis pesanmu di sini..." autocomplete="off"
                    class="flex-1 bg-white border-3 border-black rounded-xl px-4 py-3 text-sm sm:text-base font-bold placeholder-slate-400 outline-none shadow-[3px_3px_0px_#000] focus:translate-x-0.5 focus:translate-y-0.5 transition-all">
                <button type="submit" id="send-btn"
                    class="comic-button bg-cyan-400 hover:bg-cyan-300 text-black font-['Bangers'] text-lg sm:text-xl px-5 py-3 rounded-xl flex items-center justify-center shrink-0 tracking-wide">
                    KIRIM <i class="fa-solid fa-paper-plane ml-1 text-sm"></i>
                </button>
            </form>
        </div>

    </main>

    <!-- Footer Note -->
    <footer class="w-full max-w-2xl mx-auto text-center text-xs font-bold text-black pb-1 shrink-0">
        Comic AI Chat &bull; Designed & Built for <span class="text-red-700 underline font-extrabold">Iwaw</span> ⚡
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const typingIndicator = document.getElementById('typing-indicator');

        // Status mode: 'direct' (pake API asli) atau 'simulation' (jika browser memblokir CORS secara ketat)
        let useSimulation = false;

        let conversationHistory = [
            { role: "system", content: "Kamu adalah asisten AI bertema komik yang ramah, seru, dan membantu, dikembangkan oleh Iwaw." }
        ];

        function toggleCorsMode() {
            useSimulation = !useSimulation;
            const label = document.getElementById('mode-label');
            if (useSimulation) {
                label.innerText = "Sim Mode";
                appendSystemMessage("⚡ Mode Simulasi Cerdas diaktifkan (Berguna jika server eksternal melarang CORS dari browser).");
            } else {
                label.innerText = "API Mode";
                appendSystemMessage("🌐 Mode API Langsung diaktifkan ke http://api.rootly.my.id:40024/v1");
            }
        }

        async function handleSendMessage(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            conversationHistory.push({ role: "user", content: text });
            userInput.value = '';
            scrollToBottom();

            typingIndicator.classList.remove('hidden');
            scrollToBottom();

            if (useSimulation) {
                // Simulasi respons interaktif cerdas gaya komik jika mode simulasi aktif
                setTimeout(() => {
                    typingIndicator.classList.add('hidden');
                    const simReplies = [
                        `BAM! Pesan diterima dengan baik, Iwaw! Mengenai "${text}", sistem mendapati bahwa ini adalah pertanyaan yang menarik untuk dieksplorasi lebih lanjut. 💥`,
                        `ZAP! Pertanyaan hebat! Dalam dunia komik AI, "${text}" dapat diselesaikan dengan strategi cepat dan kreatif. Ada hal spesifik lain yang ingin dibahas? ✨`,
                        `POW! Catatan diterima! "${text}" adalah topik luar biasa. Mari kita buat proyek keren berikutnya bersama-sama! 🚀`
                    ];
                    const reply = simReplies[Math.floor(Math.random() * simReplies.length)];
                    appendMessage(reply, 'bot');
                    conversationHistory.push({ role: "assistant", content: reply });
                    scrollToBottom();
                }, 1000);
                return;
            }

            // Integrasi API Langsung
            const endpoint = "http://api.rootly.my.id:40024/v1/chat/completions";
            const apiKey = "sk-rootly-I3dNPfKII8KdYDHG2gVJcC9453UGMKSxRTH5cCCIWgw";

            try {
                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "deepseek-ai/DeepSeek-V4-Flash-0731",
                        messages: conversationHistory
                    })
                });

                const data = await response.json();
                typingIndicator.classList.add('hidden');

                if (response.ok && data.choices && data.choices.length > 0) {
                    const botReply = data.choices[0].message.content;
                    appendMessage(botReply, 'bot');
                    conversationHistory.push({ role: "assistant", content: botReply });
                } else {
                    handleApiError("Server merespons dengan status error atau format tidak sesuai.");
                }
            } catch (error) {
                typingIndicator.classList.add('hidden');
                handleApiError("Koneksi diblokir kebijakan CORS browser atau jaringan terputus. Klik tombol 'API Mode' di atas untuk beralih ke Mode Simulasi Cerdas jika diperlukan.");
                console.error("Fetch Error:", error);
            }

            scrollToBottom();
        }

        function handleApiError(errorDetail) {
            const errorMsg = `KABOOM! Terjadi kendala koneksi API: ${errorDetail}`;
            appendMessage(errorMsg, 'bot');
        }

        function appendMessage(text, sender) {
            const isUser = sender === 'user';
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex items-start space-x-3 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;

            const avatarBg = isUser ? 'bg-cyan-400 text-black' : 'bg-red-500 text-white';
            const bubbleStyle = isUser ? 'bubble-user rounded-2xl rounded-tr-none' : 'bubble-bot rounded-2xl rounded-tl-none';

            messageDiv.innerHTML = `
                <div class="w-9 h-9 sm:w-10 sm:h-10 ${avatarBg} border-3 border-black rounded-xl flex items-center justify-center shrink-0 mt-1 font-['Bangers'] text-base shadow-[2px_2px_0px_#000]">
                    ${isUser ? 'YOU' : 'AI'}
                </div>
                <div class="max-w-[80%] sm:max-w-[75%] ${bubbleStyle} px-4 py-3 text-sm sm:text-base font-bold leading-relaxed">
                    ${escapeHtml(text)}
                </div>
            `;

            chatContainer.appendChild(messageDiv);
        }

        function appendSystemMessage(text) {
            const div = document.createElement('div');
            div.className = "text-center my-2";
            div.innerHTML = `<span class="inline-block bg-yellow-100 border-2 border-black px-3 py-1 rounded-lg text-xs font-bold text-black shadow-[2px_2px_0px_#000]">${escapeHtml(text)}</span>`;
            chatContainer.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function clearChat() {
            chatContainer.innerHTML = `
                <div class="flex items-start space-x-3">
                    <div class="w-9 h-9 sm:w-10 sm:h-10 bg-red-500 border-3 border-black rounded-xl flex items-center justify-center text-white font-['Bangers'] text-lg shadow-[2px_2px_0px_#000] shrink-0 mt-1">
                        AI
                    </div>
                    <div class="max-w-[80%] sm:max-w-[75%] bubble-bot rounded-2xl rounded-tl-none px-4 py-3 text-sm sm:text-base font-bold leading-relaxed">
                        ZAP! Percakapan telah di-reset bersih. Siap memulai misi baru bersama Iwaw? ⚡
                    </div>
                </div>
            `;
            conversationHistory = [
                { role: "system", content: "Kamu adalah asisten AI bertema komik yang ramah, seru, dan membantu, dikembangkan oleh Iwaw." }
            ];
        }

        function escapeHtml(string) {
            return string
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;")
                .replace(/\n/g, "<br>");
        }
    </script>
</body>
</html>
